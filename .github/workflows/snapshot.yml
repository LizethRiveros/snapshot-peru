name: snapshot
on:
  schedule:
    - cron: "0 14 * * *"   # 09:00 hora de Lima, todos los dias
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar series
        run: python scripts/snapshot.py
      - name: Guardar cambios
        run: |
          git config user.name "snapshot-peru"
          git config user.email "snapshot-peru@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "datos: $(date -u +%F)"
            git push
          fi
